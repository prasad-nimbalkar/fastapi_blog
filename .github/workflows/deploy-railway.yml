name: Deploy to Railway

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to Railway
      uses: railway-app/deploy-action@v1
      with:
        railway-token: ${{ secrets.RAILWAY_TOKEN }}
